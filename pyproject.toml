[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indian-market-anomalies"
version = "0.1.0"
description = "Reproducible NSE cash-equity anomaly scanner and 252-session PnL ranking"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pandas>=2.0",
  "Pillow>=10.0",
  "pyarrow>=14",
  "requests>=2.31",
  "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
